name: InnPro sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run InnPro transform
        env:
          INNPRO_FULL_URL: ${{ secrets.INNPRO_FULL_URL }}
          INNPRO_LIGHT_URL: ${{ secrets.INNPRO_LIGHT_URL }}
          INNPRO_MARKUP: '15'
          INNPRO_OUT: output/innpro.xml
        run: node scripts/transform-innpro.js

      - name: Commit updated output
        run: |
          git config user.name "innpro-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/innpro.xml
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický InnPro sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
