name: Finalize feed
description: >
  Spoločný záver dodávateľských syncov: poistka proti useknutému feedu, SEO overrides,
  vypredaj, dostupnosť a EAN. Poradie je rovnaké ako predtým v každom
  *-sync.yml. (BASYS má vlastné poradie, preto túto akciu nepoužíva.)

inputs:
  supplier:
    description: Kód dodávateľa (kb, monacor, solight, innpro, atos, penta); určuje output/<supplier>.xml.
    required: true

runs:
  using: composite
  steps:
    - name: Poistka proti useknutému feedu
      shell: bash
      run: node scripts/check-feed-size.js

    - name: Apply supplier-aware CTR SEO overrides (inactive by default)
      shell: bash
      run: node scripts/apply-seo-overrides.js --write

    - name: Apply internal sale state to original supplier products
      shell: bash
      run: node scripts/apply-vypredaj-to-feeds.js

    - name: Nastaviť nedostupnosť a URL-only pre produkty vypadnuté z feedu dodávateľa
      shell: bash
      env:
        SUPPLIER: ${{ inputs.supplier }}
      run: node scripts/apply-missing-availability.js --supplier="$SUPPLIER" --xml="output/$SUPPLIER.xml"

    - name: Dostupnosť pri vypredaní vždy rovnaká ako dostupnosť (vypnutie aj znovu zapnutie v Shoptete)
      shell: bash
      env:
        SUPPLIER: ${{ inputs.supplier }}
      run: node scripts/sync-out-of-stock-availability.js "output/$SUPPLIER.xml"

    - name: Normalize valid supplier GTINs to EAN-13
      shell: bash
      env:
        SUPPLIER: ${{ inputs.supplier }}
      run: node scripts/normalize-truncated-ean.js "output/$SUPPLIER.xml"

    - name: Hlavná fotka podľa data/image-overrides.json
      shell: bash
      env:
        SUPPLIER: ${{ inputs.supplier }}
      run: node scripts/apply-image-overrides.js --supplier="$SUPPLIER"
