name: Read drafts check

# Read-only kontrolný beh: vypíše obsah posledných správ v priečinku Drafts, aby sa
# dala overiť kvalita návrhov vygenerovaných draft-order-replies.js. Spúšťa sa len
# ručne.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Read Drafts folder content
        env:
          SEZNAM_IMAP_USER: ${{ secrets.SEZNAM_IMAP_USER }}
          SEZNAM_IMAP_PASSWORD: ${{ secrets.SEZNAM_IMAP_PASSWORD }}
        run: node scripts/read-drafts.js
