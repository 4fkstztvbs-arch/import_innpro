name: WiiM sync

on:
  push:
    branches: [main]
    paths:
      - 'data/wiim-pricelist.pdf'
      - 'scripts/transform-wiim.js'
      - 'scripts/parse-wiim-pricelist.js'
      - '.github/workflows/wiim-sync.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: premiumstore-vypredaj-state
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the output published by the preceding run.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PDF and Node dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm install --omit=dev

      - name: Generate WiiM feed
        run: node scripts/transform-wiim.js

      - name: Apply internal sale state to original supplier products
        run: node scripts/apply-vypredaj-to-feeds.js

      - name: Nastaviť nedostupnosť a URL-only pre produkty vypadnuté z WiiM feedu
        run: node scripts/apply-missing-availability.js --supplier=wiim --xml=output/wiim.xml

      - name: Normalize valid supplier GTINs to EAN-13
        run: node scripts/normalize-truncated-ean.js output/wiim.xml

      - name: Check output size
        run: node scripts/check-feed-size.js

      - name: Commit updated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wiim-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "WiiM sync with missing-product availability"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 8))
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
