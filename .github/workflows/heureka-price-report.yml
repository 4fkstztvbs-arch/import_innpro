name: Heureka price report

on:
  push:
    branches: [main]
    paths:
      - 'data/heureka-reports/*.[cC][sS][vV]'
      - 'data/heureka-reports/black-friday-allowlist.json'
      - 'scripts/heureka-black-friday-allowlist.js'
      - 'scripts/heureka-pricing.js'
      - 'scripts/heureka-pricing-policy.json'
      - 'scripts/compare-heureka-prices.js'
      - 'scripts/process-heureka-report.js'
      - 'scripts/heureka-price-targets.js'
      - 'scripts/apply-price-targets.js'
      - 'scripts/round-price.js'
      - 'scripts/tests/heureka-pricing.test.js'
      - 'scripts/apply-heureka-conversion-rules.js'
      - 'scripts/heureka-conversion-rules.json'
      - 'scripts/apply-free-shipping.js'
      - 'data/free-shipping-rules.json'
      - '.github/workflows/heureka-price-report.yml'
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC (00:00 SK) daily — first in the tight night batch, before ATOS at 22:10 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: heureka-price-report
  cancel-in-progress: false

jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Verify Heureka pricing rules
        run: node --test scripts/tests/heureka-pricing.test.js

      - name: Process Heureka report if a newer one was uploaded
        run: node scripts/process-heureka-report.js

      # Ceny sa zapíšu rovno do hotových feedov, aby ich vyzdvihol najbližší denný
      # import. Idempotentné a bez nákupnej ceny vo feede sa nič nemení.
      - name: Zapísať nové ceny do output/*.xml
        run: node scripts/apply-price-targets.js
        env:
          HEUREKA_PRICE_OVERRIDE: '1'

      # Skrytie produktov so slabou konverziou podľa nového reportu.
      - name: Heureka konverzné pravidlá
        run: node scripts/apply-heureka-conversion-rules.js

      - name: Doprava zdarma pre drahé malé produkty
        run: node scripts/apply-free-shipping.js --xml=output/atos.xml && node scripts/apply-free-shipping.js --xml=output/basys.xml && node scripts/apply-free-shipping.js --xml=output/innpro.xml && node scripts/apply-free-shipping.js --xml=output/kb.xml && node scripts/apply-free-shipping.js --xml=output/monacor.xml && node scripts/apply-free-shipping.js --xml=output/penta.xml && node scripts/apply-free-shipping.js --xml=output/solight.xml

      # Heureka cena ma marzove dno, ale poistka ma stat za kazdym, kto cenu meni.
      - name: Skryť produkty pod nákupnou cenou
        run: node scripts/hide-below-cost-products.js

      - name: Poistka proti useknutému feedu
        run: node scripts/check-feed-size.js

      - name: Apply supplier-aware CTR SEO overrides (inactive by default)
        run: node scripts/apply-seo-overrides.js --write

      - name: Commit price targets + report (only if something new was processed)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "heureka-price-report-bot"
          git config user.email "actions@users.noreply.github.com"
          echo "== git status before staging =="
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "No changes (nothing new to process)"
            exit 0
          fi
          git commit -m "Automatický Heureka cenový report $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "== git status after commit =="
          git status --short
          git fetch origin main
          REGENERATED_FILES=(
            "reports/produkty-pod-nakupnou-cenou.md"
          )
          for i in 1 2 3 4 5; do
            echo "== rebase attempt $i =="
            if git rebase origin/main; then
              git push origin HEAD:main
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "Rebase failed on attempt $i, conflicts in:"
            echo "$CONFLICTS"
            ONLY_REGENERATED=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if ! printf '%s\n' "${REGENERATED_FILES[@]}" | grep -qxF "$f"; then
                ONLY_REGENERATED=false
                break
              fi
            done <<< "$CONFLICTS"
            if [ -n "$CONFLICTS" ] && [ "$ONLY_REGENERATED" = true ]; then
              echo "Only regenerated-report conflicts — keeping this run's freshly computed version and continuing rebase"
              for f in $CONFLICTS; do
                git checkout --theirs -- "$f"
                git add "$f"
              done
              if GIT_EDITOR=true git rebase --continue; then
                git push origin HEAD:main
                echo "Push succeeded on attempt $i (after auto-resolving regenerated-report conflict)"
                exit 0
              fi
            fi
            echo "Aborting and retrying..."
            git rebase --abort || true
            git status --short
            sleep $((i * 8))
          done
          echo "::error::Failed to rebase and push after 5 attempts"
          exit 1
