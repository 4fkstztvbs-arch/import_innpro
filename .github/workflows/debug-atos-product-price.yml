name: Debug ATOS product price probe

# One-off manual probe — checks the current raw feed values for the known-bad solar bundle SKUs
# (EXCLUDED_CODES in transform-atos.js) to see if ATOS has fixed the PURCHASE_PRICE bug yet.
# Not scheduled; delete once the answer is known.

on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Comma-separated ATOS product codes to look up'
        required: false
        default: 'ATO-04280479,ATO-04280480,ATO-04280481,ATO-04280483,ATO-04280487'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Probe ATOS product price
        env:
          CODES: ${{ github.event.inputs.codes }}
          ATOS_URL: ${{ secrets.ATOS_URL }}
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
        run: node scripts/debug-atos-product-price.js
