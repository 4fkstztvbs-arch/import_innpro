name: Debug ATOS price comparison probe

# One-off manual probe — compares our current purchase-price-based pricing formula against a
# hypothetical PRICE_VAT-based formula across the whole live ATOS feed, to gauge how big a
# repricing shift switching to PRICE_VAT would cause. Not scheduled; delete once the answer
# is known.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Compare ATOS pricing formulas
        env:
          ATOS_URL: ${{ secrets.ATOS_URL }}
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
        run: node scripts/debug-atos-price-comparison.js
