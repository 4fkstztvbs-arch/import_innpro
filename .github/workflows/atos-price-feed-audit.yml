name: ATOS price feed audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atos-price-feed-audit.yml'
      - 'scripts/audit-atos-price-feed.js'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Query ATOS daytime price feed for product identifiers
        env:
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
        run: node scripts/audit-atos-price-feed.js
