name: Draft delay notices

# Upokojujúce emaily o "drobnom zdržaní" pre otvorené objednávky staršie ako 3 dni.
# Emaily sa ukladajú LEN do priečinka Drafts na obchod@premiumstore.sk - nič sa
# neodosiela automaticky, kolega ich skontroluje a odošle. Opakovanie rieši skript sám
# (ak už v Drafts/Sent existuje správa s číslom objednávky, preskočí ju), takže workflow
# nič nezapisuje do repozitára. Beží automaticky každý deň ráno od 4:00 slovenského času
# a dá sa spustiť aj ručne (naostro; dry_run je voliteľný).
#
# GitHub plánované behy často oneskoruje alebo vynechá, preto je ranných pokusov viac
# (každých 30 minút v UTC hodinách 02-05, spolu 8 cronov). Krok "Local time check" nechá
# prejsť len behy, ktoré pripadnú na 4:00-7:59 miestneho času Europe/Bratislava (letný aj
# zimný čas). Opakované behy nerobia škodu: koncepty sa nezdvojujú (kontrola Drafts a Sent)
# a ranný report sa pošle len raz za deň (kontrola značky [URG-RRRR-MM-DD] v INBOX/Sent).

on:
  schedule:
    - cron: '7 2 * * *'
    - cron: '37 2 * * *'
    - cron: '7 3 * * *'
    - cron: '37 3 * * *'
    - cron: '7 4 * * *'
    - cron: '37 4 * * *'
    - cron: '7 5 * * *'
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Len vypísať, čo by sa vytvorilo (bez IMAP)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Local time check
        id: tz
        run: |
          H=$(TZ=Europe/Bratislava date +%H)
          echo "Miestny čas v Bratislave: $(TZ=Europe/Bratislava date +%H:%M)"
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$H" -lt 4 ] || [ "$H" -gt 7 ]; }; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Mimo rannej schémy 4:00-7:59 - plánovaný beh sa preskakuje."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tz.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.tz.outputs.go == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.tz.outputs.go == 'true'
        run: npm install --omit=dev

      - name: Create delay-notice drafts
        if: steps.tz.outputs.go == 'true'
        env:
          SEZNAM_IMAP_USER: ${{ secrets.SEZNAM_IMAP_USER }}
          SEZNAM_IMAP_PASSWORD: ${{ secrets.SEZNAM_IMAP_PASSWORD }}
          ORDERS_XML_URL: ${{ secrets.ORDERS_XML_URL }}
          URGENT_REPORT_TO: ${{ vars.URGENT_REPORT_TO }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/draft-delay-notices.js
