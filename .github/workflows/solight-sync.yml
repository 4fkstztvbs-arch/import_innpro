name: Solight sync

on:
  schedule:
    # Generate this feed before 21:00 Bratislava time and ahead of the overnight Shoptet imports.
    - cron: '15 20 * * *'
      timezone: 'Europe/Bratislava' # 20:15 local time, with DST handling
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: premiumstore-vypredaj-state
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the output published by the preceding run.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run Solight transform
        env:
          SOLIGHT_URL: ${{ secrets.SOLIGHT_URL }}
          SOLIGHT_MARKUP: '0'
          # Cenová podlaha na NÁKUPNEJ cene bez DPH — pozri komentár v innpro-sync.yml.
          # Solight má najvyšší podiel lacného tovaru v katalógu (48,6 % pod 10 €), touto
          # hranicou vypadne len ~27 kusov (2,1 %) — zvyšok drobného sortimentu ostáva.
          SOLIGHT_MIN_COST: '0.50'
          SOLIGHT_OUT: output/solight.xml
          SOLIGHT_IMAGE_PROXY_BASE: ${{ secrets.SOLIGHT_IMAGE_PROXY_BASE }}
          SOLIGHT_EXCLUDE_UNAVAILABLE: '1'
          HEUREKA_PRICE_OVERRIDE: '1'
        run: node scripts/transform-solight.js

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - uses: ./.github/actions/postprocess-categories
        with:
          finalize-solight-category: 'true'

      - uses: ./.github/actions/finalize-feed
        with:
          supplier: solight

      - uses: ./.github/actions/commit-output
        with:
          bot-name: solight-sync-bot
          label: "Automatický Solight sync"
