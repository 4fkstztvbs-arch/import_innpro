name: InnPro sync

on:
  schedule:
    # 03:00 UTC daily = 04:00/05:00 SK time depending on DST — well inside the 00:00–07:00
    # window Shoptet's own "úplný import" uses, and after InnPro's full.xml regenerates at 00:00.
    - cron: '0 3 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab any time

permissions:
  contents: write # needed to commit the generated XML into the repo (served via Pages)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run InnPro transform
        env:
          INNPRO_FULL_URL: ${{ secrets.INNPRO_FULL_URL }}
          INNPRO_LIGHT_URL: ${{ secrets.INNPRO_LIGHT_URL }}
          INNPRO_MARKUP: '15'
          INNPRO_OUT: output/innpro.xml
        run: node scripts/transform-innpro.js

      - name: Commit updated output
        run: |
          git config user.name "innpro-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický InnPro sync $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i) — another workflow likely pushed at the same time. Retrying in $((i*8))s..."
            sleep $((i*8))
            if [ "$i" = "5" ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
          done
