name: InnPro sync

on:
  schedule:
    # Daytime refreshes retain their UTC cadence. Run the nightly supplier output before 21:00 Slovakia time.
    - cron: '0 4,10,16 * * *'
    - cron: '25 20 * * *'
      timezone: 'Europe/Bratislava' # 20:25 local time, with DST handling
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab any time
  push:
    branches:
      - main
    paths:
      - ".github/workflows/innpro-sync.yml"
      - "scripts/heureka-ean-overrides-innpro.json"
      - "scripts/apply-missing-availability.js"

permissions:
  contents: write # needed to commit the generated XML into the repo (served via Pages)

concurrency:
  group: premiumstore-vypredaj-state
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the output published by the preceding run.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run InnPro transform
        env:
          INNPRO_FULL_URL: ${{ secrets.INNPRO_FULL_URL }}
          INNPRO_LIGHT_URL: ${{ secrets.INNPRO_LIGHT_URL }}
          INNPRO_MARKUP: '15'
          # Cenová podlaha na NÁKUPNEJ cene bez DPH (2026-08-24). Pod ňou zisk na kus
          # nepokryje ani spracovanie objednávky (priemer 0,04 €) a pri zaokrúhľovaní
          # vznikali aj záporné marže. Zákazníci si tento drobný tovar berú ako
          # príslušenstvo popri inom nákupe, preto zámerne nízka hranica — nie odstránenie
          # celého lacného sortimentu. Počet vylúčených nájdeš v štatistike behu ako
          # "skippedCheap".
          INNPRO_MIN_COST: '0.50'
          INNPRO_OUT: output/innpro.xml
          INNPRO_EXCLUDE_UNAVAILABLE: '1'
          HEUREKA_PRICE_OVERRIDE: '1'
        run: node scripts/transform-innpro.js

      # A reused supplier CODE can point to a different product. Quarantine that one item
      # before dedupe so another supplier's valid equivalent is not dropped with it.
      - name: Quarantine changed approved-name identities (InnPro)
        run: node scripts/validate-innpro-name-overrides.js --in=output/innpro.xml --quarantine

      - name: Add fallback parameters (Heureka PARAM)
        env:
          FALLBACK_PARAMS_XML: output/innpro.xml
        run: node scripts/add-fallback-params.js

      - name: Normalize parameter names and values to Slovak
        env:
          PARAMS_XML: output/innpro.xml
        run: node scripts/normalize-feed-params.js

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - uses: ./.github/actions/postprocess-categories

      - uses: ./.github/actions/finalize-feed
        with:
          supplier: innpro

      - uses: ./.github/actions/commit-output
        with:
          bot-name: innpro-sync-bot
          label: "Automatický InnPro sync"
