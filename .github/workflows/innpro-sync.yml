name: InnPro sync

on:
  schedule:
    # 4x denne, 6h od seba (4:00 / 10:00 / 16:00 / 22:00 UTC), aby boli dáta čerstvé pred
    # každým Shoptet Automatickým importom (ten je teraz tiež nastavený na 4x denne v
    # Shoptet administrácii). 22:00 UTC = ~00:00 SK, tesne po tom, čo InnPro regeneruje svoj
    # vlastný full.xml.
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab any time

permissions:
  contents: write # needed to commit the generated XML into the repo (served via Pages)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run InnPro transform
        env:
          INNPRO_FULL_URL: ${{ secrets.INNPRO_FULL_URL }}
          INNPRO_LIGHT_URL: ${{ secrets.INNPRO_LIGHT_URL }}
          INNPRO_MARKUP: '15'
          INNPRO_OUT: output/innpro.xml
          INNPRO_EXCLUDE_UNAVAILABLE: '1'
          HEUREKA_PRICE_OVERRIDE: '1'
          HEUREKA_NAME_OVERRIDE: '1'
        run: node scripts/transform-innpro.js

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - name: Commit updated output
        run: |
          git config user.name "innpro-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický InnPro sync $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i) — another workflow likely pushed at the same time. Retrying in $((i*8))s..."
            sleep $((i*8))
            if [ "$i" = "5" ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
          done
