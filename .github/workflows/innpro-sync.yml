name: InnPro sync

on:
  schedule:
    # 4x denne, 6h od seba (4:00 / 10:00 / 16:00 / 22:00 UTC), aby boli dáta čerstvé pred
    # každým Shoptet Automatickým importom (ten je teraz tiež nastavený na 4x denne v
    # Shoptet administrácii). 22:00 UTC = ~00:00 SK, tesne po tom, čo InnPro regeneruje svoj
    # vlastný full.xml.
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab any time

permissions:
  contents: write # needed to commit the generated XML into the repo (served via Pages)

concurrency:
  group: premiumstore-vypredaj-state
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run InnPro transform
        env:
          INNPRO_FULL_URL: ${{ secrets.INNPRO_FULL_URL }}
          INNPRO_LIGHT_URL: ${{ secrets.INNPRO_LIGHT_URL }}
          INNPRO_MARKUP: '15'
          # Cenová podlaha na NÁKUPNEJ cene bez DPH (2026-08-24). Pod ňou zisk na kus
          # nepokryje ani spracovanie objednávky (priemer 0,04 €) a pri zaokrúhľovaní
          # vznikali aj záporné marže. Zákazníci si tento drobný tovar berú ako
          # príslušenstvo popri inom nákupe, preto zámerne nízka hranica — nie odstránenie
          # celého lacného sortimentu. Počet vylúčených nájdeš v štatistike behu ako
          # "skippedCheap".
          INNPRO_MIN_COST: '0.50'
          INNPRO_OUT: output/innpro.xml
          INNPRO_EXCLUDE_UNAVAILABLE: '1'
          HEUREKA_PRICE_OVERRIDE: '1'
        run: node scripts/transform-innpro.js

      # A reused supplier CODE can point to a different product. Quarantine that one item
      # before dedupe so another supplier's valid equivalent is not dropped with it.
      - name: Quarantine changed approved-name identities (InnPro)
        run: node scripts/validate-innpro-name-overrides.js --in=output/innpro.xml --quarantine

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - name: Collapse duplicate categories
        run: node scripts/collapse-duplicate-categories.js

      - name: Fix ignored categories (Heureka)
        run: node scripts/fix-ignored-categories.js

      - name: Potvrdené opravy produktov z auditu
        run: node scripts/apply-product-category-corrections.js --write

      - name: Collapse thin categories
        run: node scripts/collapse-thin-categories.js

      # Posledný krok, ktorý sa dotýka kategórií: zaručuje, že v XML nezostane kategória mimo
      # nášho stromu, ktorú by Shoptet pri importe vytvoril
      - name: Enforce tree categories
        run: node scripts/enforce-tree-categories.js

      - name: Skryť produkty bez kategórie
        run: node scripts/hide-uncategorised-products.js

      # Nesmieme predávať pod nákupnú cenu. Beží až za všetkými krokmi, ktoré menia cenu.
      - name: Skryť produkty pod nákupnou cenou
        run: node scripts/hide-below-cost-products.js

      - name: Approved category tree and visible 8-product minimum
        run: node scripts/apply-approved-categories.js --write

      - name: Vianočné zaradenie, parametre a rozcestníky
        run: node scripts/apply-christmas-products.js --write

      - name: Interné prelinkovanie na vlastnú kategóriu (SEO)
        run: node scripts/add-category-links.js

      - name: Kontrola odkazov na kategórie
        run: node scripts/check-category-links.js

      - name: Poistka proti useknutému feedu
        run: node scripts/check-feed-size.js

      - name: Apply supplier-aware CTR SEO overrides (inactive by default)
        run: node scripts/apply-seo-overrides.js --write

      - name: Quarantine any remaining changed approved-name identities (InnPro)
        run: node scripts/validate-innpro-name-overrides.js --in=output/innpro.xml --quarantine

      - name: Lokalizovať názvy podľa spoločného registra
        run: |
          cp output/innpro.xml /tmp/innpro-before-name-localization.xml
          node scripts/localize-product-names.js --supplier=innpro --in=output/innpro.xml --out=output/innpro.xml --strict=0
          node scripts/validate-product-name-localization.js --supplier=innpro --before=/tmp/innpro-before-name-localization.xml --after=output/innpro.xml
          node scripts/check-feed-size.js
      - name: Apply return-stock sale prices after all feed transformations
        run: node scripts/apply-vypredaj-to-feed.js output/innpro.xml --allow-missing

      - name: Commit updated output
        run: |
          git config user.name "innpro-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický InnPro sync $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i) — another workflow likely pushed at the same time. Retrying in $((i*8))s..."
            sleep $((i*8))
            if [ "$i" = "5" ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
          done
