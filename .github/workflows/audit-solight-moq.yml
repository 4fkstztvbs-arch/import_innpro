name: Audit Solight MOQ fields

on:
  push:
    branches:
      - test/solight-moq-audit
    paths:
      - .github/workflows/audit-solight-moq.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit MINQTY and package
        env:
          SOLIGHT_URL: ${{ secrets.SOLIGHT_URL }}
        run: |
          node <<'NODE'
          const https = require('https');
          const http = require('http');
          const { XMLParser } = require('fast-xml-parser');

          const url = process.env.SOLIGHT_URL;
          const client = url.startsWith('https:') ? https : http;
          function get(u) {
            return new Promise((resolve,reject)=>{
              client.get(u,res=>{
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return resolve(get(new URL(res.headers.location,u).toString()));
                }
                if (res.statusCode !== 200) return reject(new Error('HTTP '+res.statusCode));
                let d=''; res.setEncoding('utf8');
                res.on('data',c=>d+=c); res.on('end',()=>resolve(d)); res.on('error',reject);
              }).on('error',reject);
            });
          }
          const txt = v => {
            if(v===undefined||v===null) return '';
            if(typeof v==='object' && '#text' in v) return String(v['#text']).trim();
            return String(v).trim();
          };
          const num = v => {
            const n=parseFloat(txt(v).replace(',','.'));
            return Number.isFinite(n)?n:0;
          };

          (async()=>{
            const xml=await get(url);
            const blocks=[...xml.matchAll(/<product>[\s\S]*?<\/product>/gi)].map(m=>m[0]);
            const parser=new XMLParser({ignoreAttributes:true,textNodeName:'#text'});
            const rows=[];
            for(const b of blocks){
              let p; try{p=parser.parse(b).product}catch{continue}
              if(!p) continue;
              rows.push({
                code:txt(p.objednaci_cislo),
                name:txt(p.sk_nazev)||txt(p.nazev)||txt(p.cs_nazev),
                minqty:num(p.MINQTY),
                package:num(p.package),
                stock:num(p.skladem),
                cost:num(p.eur_vase_cena_bez_dph),
                eshop:num(p.eur_eshop_price)
              });
            }
            const dist = key => {
              const o={}; for(const r of rows){const v=String(r[key]);o[v]=(o[v]||0)+1}
              return Object.fromEntries(Object.entries(o).sort((a,b)=>Number(a[0])-Number(b[0])));
            };
            const gt1=rows.filter(r=>r.minqty>1);
            const pkgGt1=rows.filter(r=>r.package>1);
            const both=rows.filter(r=>r.minqty>1&&r.package>1);
            const equal=both.filter(r=>r.minqty===r.package);
            const diff=both.filter(r=>r.minqty!==r.package);
            const minAbsent=rows.filter(r=>r.minqty===0);
            const packageAbsent=rows.filter(r=>r.package===0);

            console.log('SUMMARY',JSON.stringify({
              total:rows.length,
              minqtyGt1:gt1.length,
              packageGt1:pkgGt1.length,
              bothGt1:both.length,
              bothEqual:equal.length,
              bothDifferent:diff.length,
              minqtyZeroOrMissing:minAbsent.length,
              packageZeroOrMissing:packageAbsent.length,
              minqtyDistribution:dist('minqty'),
              packageDistribution:dist('package')
            },null,2));

            console.log('MINQTY_GT1_SAMPLES',JSON.stringify(gt1.slice(0,100),null,2));
            console.log('MINQTY_PACKAGE_DIFFERENT',JSON.stringify(diff.slice(0,100),null,2));
            console.log('PACKAGE_GT1_MINQTY_LE1_SAMPLES',JSON.stringify(rows.filter(r=>r.package>1&&r.minqty<=1).slice(0,60),null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
