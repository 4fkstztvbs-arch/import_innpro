name: Audit Solight MOQ fields

on:
  push:
    branches:
      - test/solight-moq-audit
    paths:
      - .github/workflows/audit-solight-moq.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare live MINQTY with current output
        env:
          SOLIGHT_URL: ${{ secrets.SOLIGHT_URL }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const https=require('https'),http=require('http');
          const {XMLParser}=require('fast-xml-parser');
          const url=process.env.SOLIGHT_URL, client=url.startsWith('https:')?https:http;
          const get=u=>new Promise((resolve,reject)=>client.get(u,res=>{
            if(res.statusCode>=300&&res.statusCode<400&&res.headers.location)return resolve(get(new URL(res.headers.location,u).toString()));
            if(res.statusCode!==200)return reject(new Error('HTTP '+res.statusCode));
            let d='';res.setEncoding('utf8');res.on('data',c=>d+=c);res.on('end',()=>resolve(d));res.on('error',reject);
          }).on('error',reject));
          const txt=v=>v==null?'':(typeof v==='object'&&'#text'in v?String(v['#text']).trim():String(v).trim());
          const num=v=>{const n=parseFloat(txt(v).replace(',','.'));return Number.isFinite(n)?n:0};
          (async()=>{
            const src=await get(url);
            const parser=new XMLParser({ignoreAttributes:true,textNodeName:'#text'});
            const rows=[];
            for(const m of src.matchAll(/<product>[\s\S]*?<\/product>/gi)){
              let p;try{p=parser.parse(m[0]).product}catch{continue}
              if(!p)continue;
              rows.push({code:txt(p.objednaci_cislo),name:txt(p.sk_nazev),minqty:num(p.MINQTY),package:num(p.package)});
            }
            const out=fs.readFileSync('output/solight.xml','utf8');
            const outCodes=new Set([...out.matchAll(/<CODE>([^<]+)<\/CODE>/g)].map(m=>m[1]));
            const active=rows.filter(r=>r.minqty>1&&outCodes.has(r.code));
            const dist={};for(const r of active)dist[r.minqty]=(dist[r.minqty]||0)+1;
            console.log('ACTIVE_SUMMARY',JSON.stringify({
              sourceTotal:rows.length,
              sourceMinGt1:rows.filter(r=>r.minqty>1).length,
              currentOutputProducts:outCodes.size,
              currentOutputMinGt1:active.length,
              distribution:Object.fromEntries(Object.entries(dist).sort((a,b)=>Number(a[0])-Number(b[0])))
            },null,2));
            console.log('ACTIVE_EXAMPLES',JSON.stringify(active.slice(0,40),null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
