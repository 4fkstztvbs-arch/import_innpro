name: Audit Solight MOQ fields

on:
  push:
    branches:
      - test/solight-moq-audit
    paths:
      - .github/workflows/audit-solight-moq.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit source feed
        env:
          SOLIGHT_URL: ${{ secrets.SOLIGHT_URL }}
        run: |
          node <<'NODE'
          const https = require('https');
          const http = require('http');
          const { XMLParser } = require('fast-xml-parser');

          const url = process.env.SOLIGHT_URL;
          if (!url) throw new Error('Missing SOLIGHT_URL');
          const client = url.startsWith('https:') ? https : http;

          function get(u) {
            return new Promise((resolve,reject)=>{
              client.get(u,res=>{
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return resolve(get(new URL(res.headers.location,u).toString()));
                }
                if (res.statusCode !== 200) return reject(new Error('HTTP '+res.statusCode));
                let d=''; res.setEncoding('utf8');
                res.on('data',c=>d+=c); res.on('end',()=>resolve(d)); res.on('error',reject);
              }).on('error',reject);
            });
          }

          (async()=>{
            const xml = await get(url);
            console.log('bytes', Buffer.byteLength(xml));

            // Enumerate raw tag names and suspicious MOQ/package-related fields.
            const tags = new Map();
            for (const m of xml.matchAll(/<([A-Za-z0-9_:-]+)(?:\s[^>]*)?>/g)) {
              const t=m[1]; tags.set(t,(tags.get(t)||0)+1);
            }
            const suspicious = [...tags.keys()].filter(t =>
              /(min|bal|pack|kart|box|mno|poc|počet|kus|qty|quant|odb|objed|nasob|násob|unit|jedn)/i.test(t)
            );
            console.log('SUSPICIOUS_TAGS', JSON.stringify(suspicious.sort()));

            const productBlocks = [...xml.matchAll(/<product>[\s\S]*?<\/product>/gi)].map(m=>m[0]);
            console.log('products', productBlocks.length);

            const words = [
              'balení','balenie','baleni','minim','minimum','min.','karton','kartón',
              'balík','balik','počet kus','pocet kus','kusů','kusov','násob','nasob',
              'množství','mnozstvi','odběr','odber','objednáv','objednav','package','pack'
            ];

            const hits=[];
            for (let i=0;i<productBlocks.length;i++) {
              const b=productBlocks[i];
              const low=b.toLowerCase();
              if (!words.some(w=>low.includes(w.toLowerCase()))) continue;
              const code=(b.match(/<objednaci_cislo>([\s\S]*?)<\/objednaci_cislo>/i)||[])[1]||'';
              const name=(b.match(/<sk_nazev>([\s\S]*?)<\/sk_nazev>/i)||[])[1]||'';
              const snippets=[];
              for (const w of words) {
                let pos=low.indexOf(w.toLowerCase());
                if(pos>=0) snippets.push(b.slice(Math.max(0,pos-180),Math.min(b.length,pos+280)).replace(/\s+/g,' '));
              }
              hits.push({code:code.replace(/<[^>]+>/g,''),name:name.replace(/<[^>]+>/g,''),snippets:[...new Set(snippets)].slice(0,4)});
              if(hits.length>=80) break;
            }
            console.log('TEXT_HITS_COUNT', hits.length);
            console.log('TEXT_HITS', JSON.stringify(hits,null,2));

            // Parse products and list top-level keys + PARAM names/values that look relevant.
            const parser=new XMLParser({ignoreAttributes:true,isArray:(n)=>n==='PARAM'});
            const keyCounts=new Map();
            const paramMap=new Map();
            for(const b of productBlocks){
              let p; try{p=parser.parse(b).product}catch{continue}
              if(!p) continue;
              for(const k of Object.keys(p)) keyCounts.set(k,(keyCounts.get(k)||0)+1);
              const params=Array.isArray(p.PARAM)?p.PARAM:(p.PARAM?[p.PARAM]:[]);
              for(const par of params){
                const n=String(par.PARAM_NAME||'').trim();
                const v=String(par.VAL||'').trim();
                if (/(min|bal|pack|kart|box|mno|počet|pocet|kus|odb|objed|nasob|násob|jedn)/i.test(n+' '+v)){
                  const key=n+'|||'+v;
                  paramMap.set(key,(paramMap.get(key)||0)+1);
                }
              }
            }
            const suspKeys=[...keyCounts.keys()].filter(t=>/(min|bal|pack|kart|box|mno|poc|počet|kus|qty|quant|odb|objed|nasob|násob|unit|jedn)/i.test(t));
            console.log('SUSPICIOUS_TOP_LEVEL_KEYS', JSON.stringify(suspKeys));
            console.log('RELEVANT_PARAMS', JSON.stringify([...paramMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,200),null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
