name: Validate INNPRO minimal amount test

on:
  push:
    branches:
      - test/innpro-minimal-amount-stock
    paths:
      - scripts/transform-innpro.js
      - scripts/parse-product.js
      - test/innpro-minimal-amount.xml
      - .github/workflows/validate-innpro-minimal-amount.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Generate full INNPRO feed with test change
        env:
          INNPRO_FULL_URL: ${{ secrets.INNPRO_FULL_URL }}
          INNPRO_LIGHT_URL: ${{ secrets.INNPRO_LIGHT_URL }}
          INNPRO_MARKUP: '15'
          INNPRO_MIN_COST: '0.50'
          INNPRO_OUT: output/innpro.xml
          INNPRO_EXCLUDE_UNAVAILABLE: '1'
          HEUREKA_PRICE_OVERRIDE: '1'
        run: |
          node scripts/transform-innpro.js
          cp output/innpro.xml /tmp/innpro-before-post.xml

      - name: Run production post-processing chain
        run: |
          node scripts/dedupe-cross-supplier.js
          node scripts/collapse-duplicate-categories.js
          node scripts/fix-ignored-categories.js
          node scripts/apply-product-category-corrections.js --write
          node scripts/collapse-thin-categories.js
          node scripts/enforce-tree-categories.js
          node scripts/hide-uncategorised-products.js
          node scripts/hide-below-cost-products.js
          node scripts/apply-approved-categories.js --write
          node scripts/apply-christmas-products.js --write
          node scripts/add-category-links.js
          node scripts/check-category-links.js
          node scripts/check-feed-size.js
          node scripts/apply-seo-overrides.js --write

      - name: Install XML validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Download current Shoptet schemas
        run: |
          curl -fsSL https://www.shoptet.cz/export/schema/products-complete-v10.rng -o /tmp/products-complete-v10.rng
          curl -fsSL https://www.shoptet.cz/export/schema/products-supplier-v10.rng -o /tmp/products-supplier-v10.rng
          curl -fsSL https://www.shoptet.cz/export/schema/products-datatype-v10.rng -o /tmp/products-datatype-v10.rng

      - name: Validate small test feed against Shoptet complete RNG
        run: xmllint --noout --relaxng /tmp/products-complete-v10.rng test/innpro-minimal-amount.xml

      - name: Validate full feed before post-processing
        run: xmllint --noout --relaxng /tmp/products-complete-v10.rng /tmp/innpro-before-post.xml

      - name: Validate final feed after post-processing
        continue-on-error: true
        run: xmllint --noout --relaxng /tmp/products-complete-v10.rng output/innpro.xml

      - name: Verify generated minimum-order values and duplicate fields
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const [label, path] of [['before-post','/tmp/innpro-before-post.xml'], ['after-post','output/innpro.xml']]) {
            const xml = fs.readFileSync(path, 'utf8');
            const items = [...xml.matchAll(/<SHOPITEM>[\s\S]*?<\/SHOPITEM>/g)].map(m => m[0]);
            const values = [...xml.matchAll(/<MINIMAL_AMOUNT>([^<]+)<\/MINIMAL_AMOUNT>/g)].map(m => m[1]);
            const distribution = {};
            for (const v of values) distribution[v] = (distribution[v] || 0) + 1;
            let badNesting = 0;
            let dupVisibility = 0, dupImages = 0, dupTextProps = 0;
            for (const item of items) {
              const mins = [...item.matchAll(/<MINIMAL_AMOUNT>([^<]+)<\/MINIMAL_AMOUNT>/g)];
              if (mins.length && !/<STOCK>[\s\S]*?<MINIMAL_AMOUNT>[^<]+<\/MINIMAL_AMOUNT>[\s\S]*?<\/STOCK>/.test(item)) badNesting++;
              const count = tag => (item.match(new RegExp('<' + tag + '(?:>|\\s)', 'g')) || []).length;
              if (count('VISIBILITY') > 1) dupVisibility++;
              if (count('IMAGES') > 1) dupImages++;
              if (count('TEXT_PROPERTIES') > 1) dupTextProps++;
            }
            console.log(label + ' SHOPITEM count:', items.length);
            console.log(label + ' MINIMAL_AMOUNT count:', values.length);
            console.log(label + ' distribution:', distribution);
            console.log(label + ' bad MINIMAL_AMOUNT nesting:', badNesting);
            console.log(label + ' duplicate VISIBILITY items:', dupVisibility);
            console.log(label + ' duplicate IMAGES items:', dupImages);
            console.log(label + ' duplicate TEXT_PROPERTIES items:', dupTextProps);

            for (const code of ['023350','035753','044831','016534']) {
              const item = items.find(s => s.includes('<CODE>' + code + '</CODE>'));
              if (!item) {
                console.log(label + ' ' + code + ': not present');
                continue;
              }
              const m = item.match(/<STOCK>[\s\S]*?<MINIMAL_AMOUNT>([^<]+)<\/MINIMAL_AMOUNT>[\s\S]*?<\/STOCK>/);
              console.log(label + ' ' + code + ': ' + (m ? 'MINIMAL_AMOUNT=' + m[1] : 'missing MINIMAL_AMOUNT'));
            }
          }
          NODE
