name: Sklad BB – finalny nočný feed

on:
  schedule:
    # BASYS is planned at 23:00 UTC; rebuild Sklad BB after the nightly supplier batch.
    # 23:30 UTC = 01:30 CEST / 00:30 CET, inside Shoptet's full-import window.
    - cron: '30 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: premiumstore-vypredaj-state
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Build final Sklad BB feed from refreshed supplier outputs
        run: node scripts/build-sklad-bb-feed.js

      - name: Commit final Sklad BB and supplier outputs
        run: |
          git config user.name "sklad-bb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sklbb-source-items.json output/*.xml output-sklad-bb/sklad-bb.xml
          if git diff --cached --quiet; then
            echo "Finálne feedy bez zmeny"
            exit 0
          fi
          git commit -m "Finálny nočný Sklad BB feed $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Finálny feed uložený"
              break
            fi
            sleep $((i * 8))
            if [ "$i" = "5" ]; then
              echo "::error::Push finálneho Sklad BB feedu zlyhal"
              exit 1
            fi
          done
