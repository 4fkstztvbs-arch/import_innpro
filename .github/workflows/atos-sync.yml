name: ATOS sync

on:
  schedule:
    - cron: '30 3 * * *' # 3:30 UTC daily — inside Shoptet's 00:00–07:00 "úplný import" window
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run ATOS transform
        env:
          ATOS_URL: ${{ secrets.ATOS_URL }}
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
          ATOS_MARKUP: '15'
          ATOS_OUT: output/atos.xml
        run: node scripts/transform-atos.js

      - name: Commit updated output
        run: |
          git config user.name "atos-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/atos.xml
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický ATOS sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
