name: ATOS sync

on:
  schedule:
    # Night supplier feed is processed after its source is available; finish before Shoptet's 00:05+ import window.
    - cron: '5 21 * * *'
      timezone: 'Europe/Bratislava' # 21:05 local time, with DST handling
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: premiumstore-vypredaj-state
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the output published by the preceding run.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Fetch ATOS image URLs (static CDN, StoItemBase_El)
        env:
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
          ATOS_IMAGE_PROXY_BASE: ${{ secrets.ATOS_IMAGE_PROXY_BASE }}
        run: node scripts/fetch-atos-images.js

      - name: Run ATOS transform
        env:
          ATOS_URL: ${{ secrets.ATOS_URL }}
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
          ATOS_MARKUP: '15'
          # Cenová podlaha na NÁKUPNEJ cene bez DPH — pozri komentár v innpro-sync.yml.
          # ATOS je najviac zasiahnutý (~577 produktov, 4,9 %): spojovací materiál, vruty,
          # sťahovacie pásky. Práve tu vznikalo 10 produktov s cenou 0,00 € a 113 so
          # zápornou maržou.
          ATOS_MIN_COST: '0.50'
          ATOS_OUT: output/atos.xml
          HEUREKA_PRICE_OVERRIDE: '1'
          ATOS_EXCLUDE_UNAVAILABLE: '1'
          ATOS_IMAGE_PROXY_BASE: ${{ secrets.ATOS_IMAGE_PROXY_BASE }}
        run: node scripts/transform-atos.js

      - name: Enrich with Icecat data (weight/specs; ATOS's own images stay primary — see README)
        run: |
          if [ -f data/icecat-atos-full.csv ]; then
            XML_IN=output/atos.xml ICECAT_CSV=data/icecat-atos-full.csv XML_OUT=output/atos.xml REPLACE_IMAGES=0 node scripts/enrich-shoptet-icecat.js
          else
            echo "data/icecat-atos-full.csv not found yet — skipping enrichment step"
          fi

      - name: Add fallback parameters (Heureka PARAM)
        env:
          FALLBACK_PARAMS_XML: output/atos.xml
        run: node scripts/add-fallback-params.js

      - name: Normalize parameter names and values to Slovak
        env:
          PARAMS_XML: output/atos.xml
        run: node scripts/normalize-feed-params.js

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - uses: ./.github/actions/postprocess-categories

      - uses: ./.github/actions/finalize-feed
        with:
          supplier: atos

      - uses: ./.github/actions/commit-output
        with:
          bot-name: atos-sync-bot
          label: "Automatický ATOS sync"
