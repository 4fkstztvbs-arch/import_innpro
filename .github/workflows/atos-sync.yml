name: ATOS sync

on:
  schedule:
    # ATOS's StoItemShoptet_El export is only available from ~21:00 CET/CEST onward (per ATOS's
    # own ResultTypeInfo table). 22:10 UTC = 00:10/01:10 CET/CEST depending on DST — inside that
    # window, and still well before Shoptet's own 00:00–07:00 "úplný import" window.
    # Second in the tight night batch (after Heureka price report at 22:00 UTC).
    - cron: '10 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Fetch ATOS image URLs (static CDN, StoItemBase_El)
        env:
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
          ATOS_IMAGE_PROXY_BASE: ${{ secrets.ATOS_IMAGE_PROXY_BASE }}
        run: node scripts/fetch-atos-images.js

      - name: Run ATOS transform
        env:
          ATOS_URL: ${{ secrets.ATOS_URL }}
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
          ATOS_MARKUP: '15'
          ATOS_OUT: output/atos.xml
          HEUREKA_PRICE_OVERRIDE: '1'
          HEUREKA_NAME_OVERRIDE: '1'
          ATOS_EXCLUDE_UNAVAILABLE: '1'
          ATOS_IMAGE_PROXY_BASE: ${{ secrets.ATOS_IMAGE_PROXY_BASE }}
        run: node scripts/transform-atos.js

      - name: Enrich with Icecat data (weight/specs; ATOS's own images stay primary — see README)
        run: |
          if [ -f data/icecat-atos-full.csv ]; then
            XML_IN=output/atos.xml ICECAT_CSV=data/icecat-atos-full.csv XML_OUT=output/atos.xml REPLACE_IMAGES=0 node scripts/enrich-shoptet-icecat.js
          else
            echo "data/icecat-atos-full.csv not found yet — skipping enrichment step"
          fi

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - name: Commit updated output
        run: |
          git config user.name "atos-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický ATOS sync $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i) — another workflow likely pushed at the same time. Retrying in $((i*8))s..."
            sleep $((i*8))
            if [ "$i" = "5" ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
          done
