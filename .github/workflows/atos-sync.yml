name: ATOS sync

on:
  schedule:
    # ATOS's StoItemShoptet_El export is only available from ~21:00 CET/CEST onward (per ATOS's
    # own ResultTypeInfo table). 20:00 UTC = 21:00/22:00 CET/CEST depending on DST — inside that
    # window, and still well before Shoptet's own 00:00–07:00 "úplný import" window.
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run ATOS transform
        env:
          ATOS_URL: ${{ secrets.ATOS_URL }}
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
          ATOS_MARKUP: '15'
          ATOS_OUT: output/atos.xml
        run: node scripts/transform-atos.js

      - name: Enrich with Icecat data (weight/images where ATOS's own feed is missing them)
        run: |
          if [ -f data/icecat-atos-full.csv ]; then
            XML_IN=output/atos.xml ICECAT_CSV=data/icecat-atos-full.csv XML_OUT=output/atos.xml node scripts/enrich-shoptet-icecat.js
          else
            echo "data/icecat-atos-full.csv not found yet — skipping enrichment step"
          fi

      - name: Commit updated output
        run: |
          git config user.name "atos-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický ATOS sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
