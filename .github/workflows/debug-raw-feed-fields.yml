name: Debug raw feed fields probe

# One-off manual probe — dumps a few unparsed raw records from ATOS or Penta's feed to see every
# field they actually send (looking for a second, independent price field alongside
# PURCHASE_PRICE). Not scheduled; delete once the answer is known.

on:
  workflow_dispatch:
    inputs:
      supplier:
        description: 'atos or penta'
        required: true
        default: 'atos'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Probe raw feed fields
        env:
          SUPPLIER: ${{ github.event.inputs.supplier }}
          ATOS_URL: ${{ secrets.ATOS_URL }}
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
          PENTA_URL: ${{ secrets.PENTA_URL }}
          PENTA_USERNAME: ${{ secrets.PENTA_USERNAME }}
          PENTA_PASSWORD: ${{ secrets.PENTA_PASSWORD }}
        run: node scripts/debug-raw-feed-fields.js
