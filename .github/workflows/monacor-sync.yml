name: MONACOR sync

on:
  schedule:
    - cron: '40 22 * * *' # 22:40 UTC (00:40 SK) daily — inside Shoptet's 00:00–07:00 "úplný import" window
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run MONACOR transform
        env:
          MONACOR_URL: ${{ secrets.MONACOR_URL }}
          MONACOR_MARKUP: '0'
          # Cenová podlaha na NÁKUPNEJ cene bez DPH — pozri komentár v innpro-sync.yml.
          # MONACOR má markup 0, takže hranica 0,50 € nákupnej ≈ 0,62 € predajnej s DPH —
          # dnes pod ňou spadnú 2 kusy (WAGO svorka, mono zástrčka).
          MONACOR_MIN_COST: '0.50'
          MONACOR_EXCLUDE_UNAVAILABLE: '1'
          MONACOR_OUT: output/monacor.xml
        run: node scripts/transform-monacor.js

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - name: Collapse duplicate categories
        run: node scripts/collapse-duplicate-categories.js

      - name: Fix ignored categories (Heureka)
        run: node scripts/fix-ignored-categories.js

      - name: Collapse thin categories
        run: node scripts/collapse-thin-categories.js

      - name: Commit updated output
        run: |
          git config user.name "monacor-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický MONACOR sync $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i) — another workflow likely pushed at the same time. Retrying in $((i*8))s..."
            sleep $((i*8))
            if [ "$i" = "5" ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
          done
