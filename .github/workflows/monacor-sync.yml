name: MONACOR sync

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 UTC daily — inside Shoptet's 00:00–07:00 "úplný import" window
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run MONACOR transform
        env:
          MONACOR_URL: ${{ secrets.MONACOR_URL }}
          MONACOR_MARKUP: '0'
          MONACOR_OUT: output/monacor.xml
        run: node scripts/transform-monacor.js

      - name: Commit updated output
        run: |
          git config user.name "monacor-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický MONACOR sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
