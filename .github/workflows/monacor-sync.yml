name: MONACOR sync

on:
  schedule:
    # Generate this feed before 21:00 Bratislava time and ahead of the overnight Shoptet imports.
    - cron: '10 20 * * *'
      timezone: 'Europe/Bratislava' # 20:10 local time, with DST handling
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monacor-sync.yml"
      - "scripts/heureka-ean-overrides-monacor.json"
      - "scripts/transform-monacor.js"

permissions:
  contents: write

concurrency:
  group: premiumstore-vypredaj-state
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the output published by the preceding run.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run MONACOR transform
        env:
          MONACOR_URL: ${{ secrets.MONACOR_URL }}
          MONACOR_MARKUP: '0'
          # Cenová podlaha na NÁKUPNEJ cene bez DPH — pozri komentár v innpro-sync.yml.
          # MONACOR má markup 0, takže hranica 0,50 € nákupnej ≈ 0,62 € predajnej s DPH —
          # dnes pod ňou spadnú 2 kusy (WAGO svorka, mono zástrčka).
          MONACOR_MIN_COST: '0.50'
          MONACOR_EXCLUDE_UNAVAILABLE: '1'
          MONACOR_OUT: output/monacor.xml
        run: node scripts/transform-monacor.js

      - name: Localize approved Slovak product names
        run: |
          cp output/monacor.xml /tmp/monacor-before-name-localization.xml
          node scripts/localize-product-names.js --supplier=monacor --in=output/monacor.xml --out=output/monacor.xml --strict=0
          node scripts/validate-product-name-localization.js --supplier=monacor --before=/tmp/monacor-before-name-localization.xml --after=output/monacor.xml

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - uses: ./.github/actions/postprocess-categories

      - name: Poistka proti useknutému feedu
        run: node scripts/check-feed-size.js

      - name: Apply supplier-aware CTR SEO overrides (inactive by default)
        run: node scripts/apply-seo-overrides.js --write

      - name: Apply internal sale state to original supplier products
        run: node scripts/apply-vypredaj-to-feeds.js

      - name: Nastaviť nedostupnosť a URL-only pre produkty vypadnuté z MONACOR feedu
        run: node scripts/apply-missing-availability.js --supplier=monacor --xml=output/monacor.xml

      - name: Normalize valid supplier GTINs to EAN-13
        run: node scripts/normalize-truncated-ean.js output/monacor.xml

      - uses: ./.github/actions/commit-output
        with:
          bot-name: monacor-sync-bot
          label: "Automatický MONACOR sync"
