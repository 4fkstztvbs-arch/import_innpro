name: ATOS packing fetch (hmotnosť balenia)

# Jednorazové/ručné stiahnutie StiPacking_El z ATOS i6ws do data/atos-packing.json.
# Nemení feedy ani e-shop; výsledok commitne do vetvy, z ktorej sa workflow spustil.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - name: Fetch StiPacking_El
        env:
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
        run: node scripts/fetch-atos-packing.js | tee packing-log.txt
      - name: Commit result
        run: |
          mkdir -p data/atos-packing-log && cp packing-log.txt data/atos-packing-log/last-run.txt
          git config user.name "atos-packing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/atos-packing.json data/atos-packing-log/last-run.txt
          git diff --staged --quiet && echo "No changes" || git commit -m "ATOS packing: hmotnosť a rozmery balenia"
          git push
