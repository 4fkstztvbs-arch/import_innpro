name: Product name localization pilot

on:
  push:
    branches:
      - pilot/sk-product-name-localization
    paths:
      - 'data/localization/**'
      - 'scripts/localize-product-names.js'
      - 'scripts/build-product-name-update-feed.js'
      - 'scripts/list-localization-candidates.js'
      - 'scripts/validate-product-name-localization.js'
      - 'scripts/parse-supplier-invoice.js'
      - 'scripts/tests/product-name-localization.test.js'
      - 'naskladnenie.html'
      - '.github/workflows/product-name-localization-pilot.yml'
      - '.github/workflows/atos-sync.yml'
      - '.github/workflows/kb-sync.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --omit=dev
      - name: Unit tests
        run: node --test scripts/tests/product-name-localization.test.js
      - name: K-B real feed dry-run
        run: |
          node scripts/localize-product-names.js --supplier=kb --in=output/kb.xml --out=/tmp/kb-localized.xml --expected=50
          node scripts/validate-product-name-localization.js --supplier=kb --before=output/kb.xml --after=/tmp/kb-localized.xml --expected=50
      - name: ATOS real feed dry-run
        run: |
          node scripts/localize-product-names.js --supplier=atos --in=output/atos.xml --out=/tmp/atos-localized.xml --expected=50
          node scripts/validate-product-name-localization.js --supplier=atos --before=output/atos.xml --after=/tmp/atos-localized.xml --expected=50
      - name: Build fail-closed K-B manual 3-product update feed
        run: |
          node scripts/build-product-name-update-feed.js \
            --supplier=kb \
            --prefix=KB_ \
            --in=output/kb.xml \
            --out=/tmp/premiumstore-kb-name-update-test3.xml \
            --codes=100000859847,100000033310,100002134534
          test "$(grep -c '<SHOPITEM>' /tmp/premiumstore-kb-name-update-test3.xml)" = "3"
          ! grep -Eq '<PRICE(_VAT)?>|<ORIG_URL>|<EAN>|<CATEGORIES>|<DESCRIPTION>' /tmp/premiumstore-kb-name-update-test3.xml
      - name: Upload K-B manual update feed
        uses: actions/upload-artifact@v4
        with:
          name: premiumstore-kb-name-update-test3
          path: /tmp/premiumstore-kb-name-update-test3.xml
          if-no-files-found: error
          retention-days: 7
      - name: Candidate sample from current feeds
        run: |
          echo '=== K-B CANDIDATES ==='
          node scripts/list-localization-candidates.js kb 80
          echo '=== ATOS CANDIDATES ==='
          node scripts/list-localization-candidates.js atos 80
