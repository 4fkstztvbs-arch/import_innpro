name: DIAG BASYS delivery date
on:
  push:
    branches: [diag/basys-delivery-date]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=dev
      - run: node scripts/diag/basys-delivery-histogram.js
        env:
          BASYS_URL: ${{ secrets.BASYS_URL }}
