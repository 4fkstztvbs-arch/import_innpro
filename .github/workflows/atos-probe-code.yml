name: ATOS probe code (diagnostika)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-7yh8ro]
    paths: ['scripts/atos-probe-code.js', '.github/workflows/atos-probe-code.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        env:
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
        run: node scripts/atos-probe-code.js
