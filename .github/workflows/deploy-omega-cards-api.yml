name: Deploy Omega cards API

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker-omega-cards/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker-omega-cards

      - name: Set Worker secrets (GitHub token + API key)
        working-directory: cloudflare-worker-omega-cards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler secret put GITHUB_TOKEN <<< "${{ secrets.OMEGA_CARDS_GH_TOKEN }}"
          npx wrangler secret put API_KEY <<< "${{ secrets.OMEGA_CARDS_API_KEY }}"
