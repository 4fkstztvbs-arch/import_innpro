name: Heureka product reviews

on:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 5:00 UTC — outside the nightly sync batch
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Fetch Heureka product reviews
        env:
          HEUREKA_PRODUCT_REVIEW_KEY: ${{ secrets.HEUREKA_PRODUCT_REVIEW_KEY }}
        run: node scripts/fetch-heureka-product-reviews.js

      - name: Commit updated reviews data
        run: |
          git config user.name "heureka-reviews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/heureka-reviews.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický Heureka product reviews export $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i) — another workflow likely pushed at the same time. Retrying in $((i*8))s..."
            sleep $((i*8))
            if [ "$i" = "5" ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
          done
