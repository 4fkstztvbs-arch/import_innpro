name: Export current INNPRO XML

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-current-innpro.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current INNPRO XML
        uses: actions/upload-artifact@v4
        with:
          name: innpro-current-xml
          path: output/innpro.xml
          if-no-files-found: error
          retention-days: 1
