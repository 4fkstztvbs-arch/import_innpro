name: Penta full export

# Jednorazový/ručný export celého Penta feedu (bez filtrov) do data/penta-full/ pre analýzu.
# Penta feed je dostupný len v noci, preto sa spúšťa ručne po 21:00.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - name: Export full Penta feed
        env:
          PENTA_URL: ${{ secrets.PENTA_URL }}
          PENTA_USERNAME: ${{ secrets.PENTA_USERNAME }}
          PENTA_PASSWORD: ${{ secrets.PENTA_PASSWORD }}
        run: |
          mkdir -p data/penta-full
          PENTA_FULL_OUT="data/penta-full/penta-full-$(date -u +%F).csv" node scripts/export-penta-full.js
      - uses: ./.github/actions/commit-output
        with:
          bot-name: penta-full-export-bot
          label: "Penta full export"
