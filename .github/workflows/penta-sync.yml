name: Penta sync

on:
  schedule:
    # Night supplier feed is processed after its source is available; finish before Shoptet's 00:05+ import window.
    - cron: '10 21 * * *'
      timezone: 'Europe/Bratislava' # 21:10 local time, with DST handling
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: premiumstore-vypredaj-state
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the output published by the preceding run.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run Penta transform
        env:
          PENTA_URL: ${{ secrets.PENTA_URL }}
          PENTA_USERNAME: ${{ secrets.PENTA_USERNAME }}
          PENTA_PASSWORD: ${{ secrets.PENTA_PASSWORD }}
          PENTA_OUT: output/penta.xml
          HEUREKA_PRICE_OVERRIDE: '1'
          # Temporary: first test run only imports categories with a confirmed match onto our
          # existing tree (reports/penta-kategorie-2026-08-24.md). Remove once the rest of the
          # categories are paired by hand and added to scripts/penta-mapping.json.
          PENTA_ONLY_MAPPED_CATEGORIES: '1'
        run: node scripts/transform-penta.js

      - name: Normalize parameter names and values to Slovak
        env:
          PARAMS_XML: output/penta.xml
        run: node scripts/normalize-feed-params.js

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - uses: ./.github/actions/postprocess-categories

      - uses: ./.github/actions/finalize-feed
        with:
          supplier: penta

      - uses: ./.github/actions/commit-output
        with:
          bot-name: penta-sync-bot
          label: "Automatický Penta sync"
