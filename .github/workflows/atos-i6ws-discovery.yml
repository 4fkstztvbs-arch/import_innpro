name: ATOS i6ws discovery (hmotnosť)

# Jednorazový prieskum, ktoré výstupy ATOS i6ws ponúka a či niektorý obsahuje hmotnosť produktov.
# Nič nezapisuje do output/. ATOS GetResult beží len v nočnom okne 21:00-07:00, preto je plán nočný.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover (všetky resultType), bycode (GetResultByCode / ByFromTo) alebo packing (StiPacking_El -> data/atos-packing.json, commit do vetvy)'
        default: discover

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - name: Probe ATOS i6ws
        env:
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "packing" ]; then node scripts/fetch-atos-packing.js | tee packing-log.txt; elif [ "${{ github.event.inputs.mode }}" = "bycode" ]; then node scripts/atos-i6ws-bycode.js; else node scripts/atos-i6ws-discover.js; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atos-i6ws-samples
          path: discovery-samples/
          if-no-files-found: ignore
      - name: Commit packing result
        if: github.event.inputs.mode == 'packing'
        run: |
          mkdir -p data/atos-packing-log && cp packing-log.txt data/atos-packing-log/last-run.txt
          git config user.name "atos-packing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/atos-packing.json data/atos-packing-log/last-run.txt
          git diff --staged --quiet && echo "No changes" || git commit -m "ATOS packing: hmotnosť a rozmery balenia"
          git push
