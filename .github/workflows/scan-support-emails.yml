name: Scan support emails

# Read-only test workflow, krok č. 2: prečíta poslednych N mailov v obchod@premiumstore.sk,
# odfiltruje zákaznícke dotazy na objednávky od automatických systémových mailov a spáruje
# ich s orders.xml exportom. Nič neposiela, nič neoznačuje ako prečítané - len overuje filter
# a lookup pred tým, ako sa na to naviaže generovanie odpovedí. Spúšťa sa len ručne.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Scan support inbox for order-related customer emails
        env:
          SEZNAM_IMAP_USER: ${{ secrets.SEZNAM_IMAP_USER }}
          SEZNAM_IMAP_PASSWORD: ${{ secrets.SEZNAM_IMAP_PASSWORD }}
          ORDERS_XML_URL: ${{ secrets.ORDERS_XML_URL }}
        run: node scripts/scan-support-emails.js
