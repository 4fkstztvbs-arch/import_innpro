name: Support inbox check

# Read-only test workflow: overuje IMAP prístup na obchod@premiumstore.sk (Seznam.cz
# emailprofi) bez toho, aby čokoľvek menil alebo odosielal. Prvý krok pred stavaním
# automatického spracovania zákazníckych emailov - spúšťa sa ručne (workflow_dispatch),
# kým sa nepotvrdí, že prístup funguje.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Check support inbox (read-only test)
        env:
          SEZNAM_IMAP_USER: ${{ secrets.SEZNAM_IMAP_USER }}
          SEZNAM_IMAP_PASSWORD: ${{ secrets.SEZNAM_IMAP_PASSWORD }}
        run: node scripts/check-support-inbox.js
