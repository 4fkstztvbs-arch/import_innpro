name: K-B sync

on:
  schedule:
    - cron: '30 22 * * *' # 22:30 UTC (00:30 SK) daily — inside Shoptet's 00:00–07:00 "úplný import" window
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run K-B transform
        env:
          KB_ZBOZI_URL: ${{ secrets.KB_ZBOZI_URL }}
          KB_KATEGORIE_URL: ${{ secrets.KB_KATEGORIE_URL }}
          KB_KATEGORIZACIA_URL: ${{ secrets.KB_KATEGORIZACIA_URL }}
          KB_CENY_URL: ${{ secrets.KB_CENY_URL }}
          KB_DOSTUPNOSTI_URL: ${{ secrets.KB_DOSTUPNOSTI_URL }}
          KB_MARKUP: '10'
          # Cenová podlaha na NÁKUPNEJ cene bez DPH — pozri komentár v innpro-sync.yml.
          # K+B dnes nemá pod touto hranicou nič (0 produktov), nastavené preventívne, aby
          # sa lacný tovar nedostal do eshopu pri budúcich zmenách cenníka.
          KB_MIN_COST: '0.50'
          KB_MIN_MARGIN: '10'
          KB_EXCLUDE_UNAVAILABLE: '1'
          KB_CHECK_ENERGY_LABELS: '1'
          KB_OUT: output/kb.xml
          HEUREKA_PRICE_OVERRIDE: '1'
        run: node scripts/transform-kb.js

      - name: Enrich with Icecat data (weight, extra images, energy labels, specs, description)
        env:
          KB_XML_IN: output/kb.xml
          ICECAT_CSV: data/icecat-full.csv
          KB_XML_OUT: output/kb.xml
        run: node scripts/enrich-kb-icecat.js

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - name: Collapse duplicate categories
        run: node scripts/collapse-duplicate-categories.js

      - name: Fix ignored categories (Heureka)
        run: node scripts/fix-ignored-categories.js

      - name: Potvrdené opravy produktov z auditu
        run: node scripts/apply-product-category-corrections.js --write

      - name: Collapse thin categories
        run: node scripts/collapse-thin-categories.js

      # Posledný krok, ktorý sa dotýka kategórií: zaručuje, že v XML nezostane kategória mimo
      # nášho stromu, ktorú by Shoptet pri importe vytvoril
      - name: Enforce tree categories
        run: node scripts/enforce-tree-categories.js

      - name: Skryť produkty bez kategórie
        run: node scripts/hide-uncategorised-products.js

      # Nesmieme predávať pod nákupnú cenu. Beží až za všetkými krokmi, ktoré menia cenu.
      - name: Skryť produkty pod nákupnou cenou
        run: node scripts/hide-below-cost-products.js

      - name: Obnoviť zastaralé generické úvodné vety po zlúčení/premenovaní kategórií
        run: node scripts/refresh-stale-generic-intros.js --out=output/kb.xml

      - name: Approved category tree and visible 8-product minimum
        run: node scripts/apply-approved-categories.js --write

      - name: Vianočné zaradenie, parametre a rozcestníky
        run: node scripts/apply-christmas-products.js --write

      - name: Interné prelinkovanie na vlastnú kategóriu (SEO)
        run: node scripts/add-category-links.js

      - name: Kontrola odkazov na kategórie
        run: node scripts/check-category-links.js

      - name: Poistka proti useknutému feedu
        run: node scripts/check-feed-size.js

      - name: Apply supplier-aware CTR SEO overrides (inactive by default)
        run: node scripts/apply-seo-overrides.js --write

      - name: Commit updated output
        run: |
          git config user.name "kb-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" || git commit -m "Automatický K-B sync $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i) — another workflow likely pushed at the same time. Retrying in $((i*8))s..."
            sleep $((i*8))
            if [ "$i" = "5" ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
          done
