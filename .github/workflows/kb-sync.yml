name: K-B sync

on:
  schedule:
    # Generate this feed before 21:00 Bratislava time and ahead of the overnight Shoptet imports.
    - cron: '5 20 * * *'
      timezone: 'Europe/Bratislava' # 20:05 local time, with DST handling
    # Denné obnovenie cien a dostupnosti (K-B) pred importmi Shoptetu o 10:05, 12:05 a 17:05.
    - cron: '25 9,11,16 * * *'
      timezone: 'Europe/Bratislava' # 25 minút po 9:00, 11:00 a 16:00 miestneho času
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kb-sync.yml"
      - "scripts/heureka-ean-overrides-kb.json"
      - "scripts/transform-kb.js"

permissions:
  contents: write

concurrency:
  group: premiumstore-vypredaj-state
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the output published by the preceding run.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run K-B transform
        env:
          KB_ZBOZI_URL: ${{ secrets.KB_ZBOZI_URL }}
          KB_KATEGORIE_URL: ${{ secrets.KB_KATEGORIE_URL }}
          KB_KATEGORIZACIA_URL: ${{ secrets.KB_KATEGORIZACIA_URL }}
          KB_CENY_URL: ${{ secrets.KB_CENY_URL }}
          KB_DOSTUPNOSTI_URL: ${{ secrets.KB_DOSTUPNOSTI_URL }}
          KB_MARKUP: '10'
          # Feed prices use purchase cost + 10% markup, then VAT.
          KB_MIN_COST: '0.50'
          KB_EXCLUDE_UNAVAILABLE: '1'
          KB_CHECK_ENERGY_LABELS: '1'
          KB_OUT: output/kb.xml
        run: node scripts/transform-kb.js

      - name: Enrich with Icecat data (weight, extra images, energy labels, specs, description)
        env:
          KB_XML_IN: output/kb.xml
          ICECAT_CSV: data/icecat-full.csv
          KB_XML_OUT: output/kb.xml
        run: node scripts/enrich-kb-icecat.js

      - name: Add fallback parameters (Heureka PARAM)
        env:
          FALLBACK_PARAMS_XML: output/kb.xml
        run: node scripts/add-fallback-params.js

      - name: Normalize parameter names and values to Slovak
        env:
          PARAMS_XML: output/kb.xml
        run: node scripts/normalize-feed-params.js

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - uses: ./.github/actions/postprocess-categories
        with:
          refresh-stale-intros: 'true'

      - uses: ./.github/actions/finalize-feed
        with:
          supplier: kb

      # Preserve the detailed price anomaly report when the feed safety gate blocks publication.
      # This repository is public, so the artifact is intentionally publicly downloadable.
      - name: Upload K-B price anomaly report
        if: failure() && hashFiles('reports/cenove-anomalie-kb.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kb-price-anomalies-${{ github.run_id }}
          path: reports/cenove-anomalie-kb.md
          if-no-files-found: error
          retention-days: 14

      - uses: ./.github/actions/commit-output
        with:
          bot-name: kb-sync-bot
          label: "Automatický K-B sync"
