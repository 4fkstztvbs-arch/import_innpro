name: K-B sync

on:
  schedule:
    # Generate this feed before 21:00 Bratislava time and ahead of the overnight Shoptet imports.
    - cron: '5 20 * * *'
      timezone: 'Europe/Bratislava' # 20:05 local time, with DST handling
    # Denné obnovenie cien a dostupnosti (K-B) pred importmi Shoptetu o 10:05, 12:05 a 17:05.
    - cron: '25 9,11,16 * * *'
      timezone: 'Europe/Bratislava' # 25 minút po 9:00, 11:00 a 16:00 miestneho času
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kb-sync.yml"
      - "scripts/heureka-ean-overrides-kb.json"

permissions:
  contents: write

concurrency:
  group: premiumstore-vypredaj-state
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the output published by the preceding run.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run K-B transform
        env:
          KB_ZBOZI_URL: ${{ secrets.KB_ZBOZI_URL }}
          KB_KATEGORIE_URL: ${{ secrets.KB_KATEGORIE_URL }}
          KB_KATEGORIZACIA_URL: ${{ secrets.KB_KATEGORIZACIA_URL }}
          KB_CENY_URL: ${{ secrets.KB_CENY_URL }}
          KB_DOSTUPNOSTI_URL: ${{ secrets.KB_DOSTUPNOSTI_URL }}
          KB_MARKUP: '10'
          # Cenová podlaha na NÁKUPNEJ cene bez DPH — pozri komentár v innpro-sync.yml.
          # K+B dnes nemá pod touto hranicou nič (0 produktov), nastavené preventívne, aby
          # sa lacný tovar nedostal do eshopu pri budúcich zmenách cenníka.
          KB_MIN_COST: '0.50'
          KB_MIN_MARGIN: '10'
          KB_EXCLUDE_UNAVAILABLE: '1'
          KB_CHECK_ENERGY_LABELS: '1'
          KB_OUT: output/kb.xml
          HEUREKA_PRICE_OVERRIDE: '1'
        run: node scripts/transform-kb.js

      - name: Enrich with Icecat data (weight, extra images, energy labels, specs, description)
        env:
          KB_XML_IN: output/kb.xml
          ICECAT_CSV: data/icecat-full.csv
          KB_XML_OUT: output/kb.xml
        run: node scripts/enrich-kb-icecat.js

      - name: Pull latest before cross-supplier dedupe
        run: |
          git stash -u
          git pull --rebase origin main
          git stash pop

      - name: Cross-supplier dedupe
        run: node scripts/dedupe-cross-supplier.js

      - uses: ./.github/actions/postprocess-categories
        with:
          refresh-stale-intros: 'true'

      - name: Poistka proti useknutému feedu
        run: node scripts/check-feed-size.js

      - name: Apply supplier-aware CTR SEO overrides (inactive by default)
        run: node scripts/apply-seo-overrides.js --write

      # SK lokalizácia NAME je pre K-B aktívna. Beží až po cenách, dedupe, kategóriách a SEO.
      - name: Lokalizovať názvy produktov do slovenčiny (K-B)
        run: |
          cp output/kb.xml /tmp/kb-before-name-localization.xml
          node scripts/localize-product-names.js --supplier=kb --in=output/kb.xml --out=output/kb.xml --strict=0
          node scripts/validate-product-name-localization.js --supplier=kb --before=/tmp/kb-before-name-localization.xml --after=output/kb.xml
          node scripts/check-feed-size.js

      - name: Apply internal sale state to original supplier products
        run: node scripts/apply-vypredaj-to-feeds.js

      - name: Nastaviť nedostupnosť a URL-only pre produkty vypadnuté z K-B feedu
        run: node scripts/apply-missing-availability.js --supplier=kb --xml=output/kb.xml

      - name: Normalize valid supplier GTINs to EAN-13
        run: node scripts/normalize-truncated-ean.js output/kb.xml

      - uses: ./.github/actions/commit-output
        with:
          bot-name: kb-sync-bot
          label: "Automatický K-B sync"
