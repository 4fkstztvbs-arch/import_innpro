name: Vypredajovy agent – mail a objednavky

on:
  schedule:
    # Kontroluje objednávky a e-mail pred každým šesťhodinovým kolom dodávateľských feedov.
    # 03:50, 09:50, 15:50 a 21:50 UTC; objednávkový stav sa premietne do ďalšieho importu.
    - cron: '50 3,9,15,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: premiumstore-vypredaj-state
  queue: max

jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Spracovať nové e-maily a objednávky
        env:
          SEZNAM_IMAP_USER: ${{ secrets.SEZNAM_IMAP_USER }}
          SEZNAM_IMAP_PASSWORD: ${{ secrets.SEZNAM_IMAP_PASSWORD }}
          ORDERS_XML_URL: ${{ secrets.ORDERS_XML_URL }}
          INNPRO_FULL_URL: ${{ secrets.INNPRO_FULL_URL }}
          KB_ZBOZI_URL: ${{ secrets.KB_ZBOZI_URL }}
          BASYS_URL: ${{ secrets.BASYS_URL }}
          PENTA_URL: ${{ secrets.PENTA_URL }}
          PENTA_USERNAME: ${{ secrets.PENTA_USERNAME }}
          PENTA_PASSWORD: ${{ secrets.PENTA_PASSWORD }}
          ATOS_URL: ${{ secrets.ATOS_URL }}
          ATOS_USERNAME: ${{ secrets.ATOS_USERNAME }}
          ATOS_PASSWORD: ${{ secrets.ATOS_PASSWORD }}
          SOLIGHT_URL: ${{ secrets.SOLIGHT_URL }}
          MONACOR_URL: ${{ secrets.MONACOR_URL }}
        run: node scripts/process-vypredaj-events.js

      - name: Aktualizovať pôvodné dodávateľské produkty podľa stavu výpredaja
        run: node scripts/apply-vypredaj-to-feeds.js

      - name: Dostupnosť pri vypredaní vždy rovnaká ako dostupnosť
        run: node scripts/sync-out-of-stock-availability.js output/*.xml

      - name: Uložiť stav a feedy na ďalší Shoptet import
        run: |
          git config user.name "vypredajovy-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/vypredaj.json data/sklbb-source-items.json output/*.xml
          if git diff --cached --quiet; then
            echo "Feedy a stav bez zmeny"
            exit 0
          fi
          git commit -m "Aktualizovať výpredajové feedy a stav"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Stav a výpredajové feedy uložené"
              break
            fi
            sleep $((i * 8))
            if [ "$i" = "5" ]; then
              echo "::error::Push výpredajového feedu zlyhal"
              exit 1
            fi
          done
